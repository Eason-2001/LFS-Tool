server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 允许上传较大的待转换文件
    client_max_body_size 50m;

    # gzip 压缩文本类资源（图片/字体已压缩，不参与，避免白耗 CPU）
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 静态资源长缓存：JS/CSS 带内容 hash，背景图等 30 天内走浏览器缓存
    location ~* \.(?:js|css|svg|webp|png|jpg|jpeg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 后端接口反向代理：/api/ 转发给后端容器
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 文件转换可能较慢，放宽代理读取超时
        proxy_read_timeout 120s;
    }

    # 转换产物 / 头像 / 备忘插图反向代理
    # ^~ 前缀优先于上面的静态资源正则，否则 .jpg/.png 会被正则抢走在前端目录找而 404
    location ^~ /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django 后台管理反向代理：/admin/ 转发给后端，不落到前端 SPA
    # ^~ 命中前缀后不再走下面的静态资源正则，避免后台路径被前端兜底拦截
    location ^~ /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端静态文件（admin 的 CSS/JS，由 whitenoise 吐出）反向代理
    # ^~ 同样跳过静态资源正则，否则 .css/.js 会被前面的正则块拿去前端目录找而 404
    location ^~ /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA history 模式回退：非静态资源的前端路由一律交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
