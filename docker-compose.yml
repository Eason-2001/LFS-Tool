# LFS-Tool 编排：后端 Django + 前端 Nginx + MySQL
# 换服务器时：装好 Docker 和 compose，把本目录代码拷过去，执行 `docker compose up -d --build` 即可
services:
  db:
    image: mysql:8.0
    container_name: lfs-mysql
    environment:
      # 库名/账号走默认值，密码从同目录 .env 读取（:? 表示未设置时报错提示，不允许空密码启动）
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lfs_tool}
      MYSQL_USER: ${MYSQL_USER:-lfs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      # MySQL 数据文件挂到宿主机 data/mysql，容器重建/换机器不丢数据
      - ./data/mysql:/var/lib/mysql
    restart: unless-stopped
    expose:
      - "3306"
    # 直连方案：把 3306 发布到宿主机。安全组务必只放行自己电脑的公网 IP，勿开 0.0.0.0/0
    ports:
      - "3306:3306"
    # 健康检查：后端要等 MySQL 真正就绪后再启动，避免首次 migrate 抢跑连不上库
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lfs-backend
    environment:
      - DJANGO_DEBUG=0
      # 以后绑域名，把域名追加到这里，逗号分隔
      - DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost,47.109.110.119
      # 数据库连接：主机名 db 是 compose 内部网络里 MySQL 服务的别名；密码从 .env 读取
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-lfs_tool}
      - DB_USER=${DB_USER:-lfs}
      - DB_PASSWORD=${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      - DB_PORT=${DB_PORT:-3306}
      # 心知天气 API Key：值从同目录 .env 读取（.env 已被 gitignore 忽略，勿提交真实值）
      - SENIVERSE_KEY=${SENIVERSE_KEY:-}
      # 万维易源 ShowAPI AppKey：命理（紫微排盘/生肖运势/黄历），值从同目录 .env 读取
      - SHOWAPI_KEY=${SHOWAPI_KEY:-}
      # 大模型（DeepSeek，OpenAI 兼容）塔罗个性化解读；未配置 Key 时回退本地静态牌意
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepseek.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
    volumes:
      # 转换产物、临时上传挂到宿主机 data 目录；数据库由 MySQL 容器的卷负责
      - ./data/outputs:/app/outputs
      - ./data/tmp_uploads:/app/tmp_uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # 不对外暴露 8000，只在内部网络给前端 Nginx 访问；排查问题时可临时加 ports: ["8000:8000"]
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lfs-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
